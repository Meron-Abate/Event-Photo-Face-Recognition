<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Find My Photos</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
    color:white;
    padding:40px 20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.hero{
    text-align:center;
    margin-bottom:50px;
}

.hero h1{
    font-size:3.5rem;
    margin-bottom:10px;
}

.hero p{
    color:#94a3b8;
    font-size:1.1rem;
}

.upload-box{
    max-width:700px;
    margin:0 auto 50px auto;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:24px;
    padding:40px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
}

.upload-icon{
    font-size:60px;
    margin-bottom:15px;
}

input[type="file"]{
    display:block;
    margin:20px auto;
    color:white;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:14px 30px;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

#loading{
    margin-top:20px;
    color:#cbd5e1;
    font-size:15px;
}

.results-title{
    margin-bottom:25px;
    text-align:center;
}

#results{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:#1e293b;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
    display:block;
}

.card-content{
    padding:15px;
}

.score{
    color:#60a5fa;
    font-weight:bold;
}

.empty{
    text-align:center;
    color:#94a3b8;
    font-size:18px;
    grid-column:1/-1;
}

</style>

</head>

<body>

<div class="container">

```
<div class="hero">
    <h1>📸 Find My Photos</h1>
    <p>Upload a selfie and instantly discover your event photos</p>
</div>

<div class="upload-box">

    <div class="upload-icon">📷</div>

    <h2>Upload Your Selfie</h2>

    <br>

    <input
        type="file"
        id="file"
        accept="image/*"
    >

    <button onclick="search()">
        🔍 Search Photos
    </button>

    <div id="loading"></div>

</div>

<h2 class="results-title">
    Matching Photos
</h2>

<div id="results"></div>
```

</div>

<script>

async function search() {

    const fileInput = document.getElementById("file");

    if (!fileInput.files.length) {
        alert("Please select a selfie first.");
        return;
    }

    const file = fileInput.files[0];

    document.getElementById("loading").innerHTML =
        "⏳ Searching through photos...";

    const formData = new FormData();
    formData.append("file", file);

    try {

        const response = await fetch("/search", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        document.getElementById("loading").innerHTML = "";

        const resultsDiv =
            document.getElementById("results");

        resultsDiv.innerHTML = "";

        if (
            !data.results ||
            data.results.length === 0
        ) {
            resultsDiv.innerHTML =
                '<div class="empty">No matching photos found.</div>';
            return;
        }

        data.results.forEach(photo => {

            resultsDiv.innerHTML += `
                <div class="card">

                    <img
                        src="${photo.image}"
                        alt="Matched Photo"
                    >

                    <div class="card-content">

                        <div class="score">
                            Match Score:
                            ${photo.distance}
                        </div>

                    </div>

                </div>
            `;

        });

    }
    catch(error){

        document.getElementById("loading").innerHTML =
            "";

        alert("Error searching photos.");

        console.error(error);

    }

}

</script>

</body>
</html>
